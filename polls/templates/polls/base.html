{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Polls{% endblock %}</title>
    {# 교재는 polls/styles.css 를 불러오지만 실제 만든 파일은 index.css · detail.css 라서 둘을 연결 #}
    <link rel="stylesheet" href="{% static 'polls/index.css' %}">
    <link rel="stylesheet" href="{% static 'polls/detail.css' %}">
</head>
<body>
    {% include "polls/header.html" %}

    <main>
        {% block content %}
        <!-- 자식 템플릿에서 이 부분이 채워집니다 -->
        {% endblock %}
    </main>

    {% include "polls/footer.html" %}

</body>
</html>
